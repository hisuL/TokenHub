name: tokenhub-silang

services:
  postgres:
    container_name: tokenhub-silang-postgres
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${TOKENHUB_INSTALL_ROOT}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks:
      - tokenhub

  tokenhub:
    container_name: tokenhub-silang-app
    image: ${TOKENHUB_IMAGE}
    restart: unless-stopped
    environment:
      TOKENHUB_ENV: prod
      TOKENHUB_DEPLOYMENT_TYPE: container
      TOKENHUB_MANAGED_UPDATES: "false"
      TOKENHUB_INSTALL_ROOT: /opt/tokenhub
      TOKENHUB_RUN_MODE: all
      TOKENHUB_HTTP_ADDR: :8080
      TOKENHUB_FRONTEND_HOST: 0.0.0.0
      TOKENHUB_FRONTEND_PORT: 3000
      TOKENHUB_PUBLIC_BASE_URL: ${TOKENHUB_PUBLIC_BASE_URL}
      TOKENHUB_API_BASE_URL: ${TOKENHUB_PUBLIC_BASE_URL}
      TOKENHUB_CORS_ALLOWED_ORIGINS: ${TOKENHUB_PUBLIC_BASE_URL}
      TOKENHUB_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      TOKENHUB_ADMIN_TOKEN: ${TOKENHUB_ADMIN_TOKEN}
      TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD: ${TOKENHUB_BOOTSTRAP_ADMIN_PASSWORD}
      TOKENHUB_SECRET_KEY: ${TOKENHUB_SECRET_KEY}
      TOKENHUB_DATABASE_URL: ""
      TOKENHUB_DB_HOST: postgres
      TOKENHUB_DB_PORT: 5432
      TOKENHUB_DB_USER: ${POSTGRES_USER}
      TOKENHUB_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TOKENHUB_DB_NAME: ${POSTGRES_DB}
      TOKENHUB_DB_SSLMODE: disable
      TOKENHUB_DB_MAX_OPEN_CONNS: ${TOKENHUB_DB_MAX_OPEN_CONNS:-25}
      TOKENHUB_DB_MAX_IDLE_CONNS: ${TOKENHUB_DB_MAX_IDLE_CONNS:-5}
      TOKENHUB_DB_CONN_MAX_LIFETIME_MINUTES: 30
      TOKENHUB_SEED_DEMO: "false"
      TOKENHUB_METRICS_ENABLED: "false"
      TOKENHUB_TRACING_ENABLED: "false"
      TOKENHUB_TRACING_CAPTURE_PAYLOADS: "false"
      TOKENHUB_UPSTREAM_NON_STREAM_TIMEOUT_SECONDS: ${TOKENHUB_UPSTREAM_NON_STREAM_TIMEOUT_SECONDS:-900}
      TOKENHUB_UPSTREAM_STREAM_IDLE_TIMEOUT_SECONDS: ${TOKENHUB_UPSTREAM_STREAM_IDLE_TIMEOUT_SECONDS:-900}
      TOKENHUB_GRACEFUL_SHUTDOWN_SECONDS: 150
    volumes:
      - ${TOKENHUB_INSTALL_ROOT}/data/releases:/opt/tokenhub
      - ${TOKENHUB_INSTALL_ROOT}/app/config:/silang-config:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 180s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - Promise.all([fetch('http://127.0.0.1:8080/readyz'),fetch('http://127.0.0.1:3000')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 25s
    networks:
      - tokenhub

  gateway:
    container_name: tokenhub-silang-gateway
    image: ${GATEWAY_IMAGE}
    restart: unless-stopped
    ports:
      - ${TOKENHUB_BIND_ADDRESS}:${TOKENHUB_PORT}:8080
    volumes:
      - ${TOKENHUB_INSTALL_ROOT}/app/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tokenhub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - tokenhub

networks:
  tokenhub:
    name: tokenhub-silang
